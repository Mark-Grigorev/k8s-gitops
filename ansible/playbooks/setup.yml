- name: Setup kubernetes node
  hosts: k8s_cluster
  become: true
  tags: kubernetes
  roles:
    - role: kubernetes

- name: Setup firewall
  hosts: all
  become: true
  tags: firewall
  roles:
    - firewall

- name: Setup grafana
  hosts: all
  become: true
  tags: grafana
  roles:
    - grafana
