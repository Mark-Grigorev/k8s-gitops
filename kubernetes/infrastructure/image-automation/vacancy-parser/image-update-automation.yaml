apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: vacancy-parser
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: vacancy-parser
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
    push:
      branch: master
  update:
    path: ./deploy
    strategy: Setters