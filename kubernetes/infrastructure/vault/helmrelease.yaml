apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 1h
  chart:
    spec:
      chart: vault
      version: "0.29.x"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    server:
      resources:
        requests:
          memory: 200Mi
          cpu: 100m
        limits:
          memory: 280Mi
          cpu: 150m
    injector:
      affinity: ""
      resources:
        requests:
          memory: 100Mi
          cpu: 50m
        limits:
          memory: 150Mi
          cpu: 75m
