apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vacancy-parser
  namespace: apps
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: ./kubernetes/charts/webapp
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vacancy-parser-values